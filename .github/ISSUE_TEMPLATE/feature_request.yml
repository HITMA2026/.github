name: 功能或改进建议
description: 提出新功能、文档补充、硬件改进或规范建议。
title: "[建议] "
body:
  - type: markdown
    attributes:
      value: |
        请在相关项目仓库中提出建议，并先检查已有 Issue。规范和通用模板的建议可提交到 HITMA2026/.github。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 谁在什么场景下遇到了什么问题？现有方式有什么不足？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的改进
      description: 描述期望的行为、接口或文档内容；无需先提供完整实现。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 如何判断完成
      description: 给出可观察的结果、使用示例或验收条件。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与补充资料
      description: 可填写已考虑的方案、相关版本、约束、参考链接或示意图。
    validations:
      required: false
